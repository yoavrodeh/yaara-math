<!doctype html>
<html lang="en">
<head>

<title>Yaara's Math</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="berry" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 21.5 C7 19.5 3.8 14.5 4.6 10.4 C5.2 7.6 8.2 6.8 12 8 C15.8 6.8 18.8 7.6 19.4 10.4 C20.2 14.5 17 19.5 12 21.5 Z"/>
    <g fill="#FFF6C8">
      <ellipse cx="9" cy="11.4" rx=".55" ry=".8"/><ellipse cx="12" cy="11.7" rx=".55" ry=".8"/><ellipse cx="15" cy="11.4" rx=".55" ry=".8"/>
      <ellipse cx="7.6" cy="14.2" rx=".55" ry=".8"/><ellipse cx="10.5" cy="14.6" rx=".55" ry=".8"/><ellipse cx="13.5" cy="14.6" rx=".55" ry=".8"/><ellipse cx="16.4" cy="14.2" rx=".55" ry=".8"/>

    </g>
    <path fill="#7CCBA2" d="M12 9.2 L9.6 6.8 L6.6 8 L8.2 5.8 L6.2 4.4 L9.4 4.7 L11 2.9 L12 4.8 L13 2.9 L14.6 4.7 L17.8 4.4 L15.8 5.8 L17.4 8 L14.4 6.8 Z"/>

  </symbol>
  <symbol id="leaf" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 1.5 C18 5 21 11 12 22.5 C3 11 6 5 12 1.5 Z"/>
    <path d="M12 22.5 V6 M12 10 L15.5 7.5 M12 14 L16 11 M12 10 L8.5 7.5 M12 14 L8 11" stroke="rgba(40,90,60,.25)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="flower" viewBox="0 0 24 24">
    <g fill="currentColor">
      <circle cx="12" cy="5.5" r="4.2"/>
      <circle cx="18.2" cy="10" r="4.2"/>
      <circle cx="15.8" cy="17.3" r="4.2"/>
      <circle cx="8.2" cy="17.3" r="4.2"/>
      <circle cx="5.8" cy="10" r="4.2"/>
    </g>
    <circle cx="12" cy="12" r="3.6" fill="#FFD36B"/>
  </symbol>
</svg>

<div class="deco" aria-hidden="true">
  <svg class="d d1"><use href="#berry"/></svg>
  <svg class="d d2"><use href="#flower"/></svg>
  <svg class="d d3"><use href="#leaf"/></svg>
  <svg class="d d4"><use href="#flower"/></svg>
  <svg class="d d5"><use href="#berry"/></svg>
  <svg class="d d6"><use href="#leaf"/></svg>
  <svg class="d d7"><use href="#flower"/></svg>
  <svg class="d d8"><use href="#berry"/></svg>
</div>

<div id="timer" class="timer hidden" aria-live="off"></div>
<main id="app"></main>

<script src="app.js"></script>
