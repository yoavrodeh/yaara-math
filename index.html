<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9622B">
<title>Yaara's Math</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="maple" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 1 L13.6 5.2 L16 4 L15.4 8.4 L19.5 6.8 L18.3 10.2 L22 11 L18.6 13.6 L19.6 15.2 L13.8 15 L14.6 18.6 L12.6 17.6 L12.6 23 L11.4 23 L11.4 17.6 L9.4 18.6 L10.2 15 L4.4 15.2 L5.4 13.6 L2 11 L5.7 10.2 L4.5 6.8 L8.6 8.4 L8 4 L10.4 5.2 Z"/>
  </symbol>
  <symbol id="leaf" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 1.5 C18 5 21 11 12 22.5 C3 11 6 5 12 1.5 Z"/>
    <path d="M12 22.5 V6 M12 10 L15.5 7.5 M12 14 L16 11 M12 10 L8.5 7.5 M12 14 L8 11" stroke="rgba(60,30,10,.3)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="flower" viewBox="0 0 24 24">
    <g fill="currentColor">
      <circle cx="12" cy="5.5" r="4.2"/>
      <circle cx="18.2" cy="10" r="4.2"/>
      <circle cx="15.8" cy="17.3" r="4.2"/>
      <circle cx="8.2" cy="17.3" r="4.2"/>
      <circle cx="5.8" cy="10" r="4.2"/>
    </g>
    <circle cx="12" cy="12" r="3.6" fill="#6B4226"/>
  </symbol>
</svg>

<div class="deco" aria-hidden="true">
  <svg class="d d1"><use href="#maple"/></svg>
  <svg class="d d2"><use href="#flower"/></svg>
  <svg class="d d3"><use href="#leaf"/></svg>
  <svg class="d d4"><use href="#flower"/></svg>
  <svg class="d d5"><use href="#maple"/></svg>
  <svg class="d d6"><use href="#leaf"/></svg>
  <svg class="d d7"><use href="#flower"/></svg>
  <svg class="d d8"><use href="#maple"/></svg>
</div>

<div id="timer" class="timer hidden" aria-live="off"></div>
<main id="app"></main>

<script src="app.js"></script>
</body>
</html>
